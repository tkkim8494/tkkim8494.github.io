<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>앱 안내</title>
<meta name="description" content="공개된 앱의 소개와 개인정보처리방침을 모아둔 곳입니다.">
<style>
  :root{--ink:#1d2b24;--body:#465a4f;--muted:#7b8f84;--card:#ffffff;--line:#e0e8e3;--soft:#f5f9f7}
  *{box-sizing:border-box}
  body{margin:0;background:var(--card);color:var(--body);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    line-height:1.75;-webkit-text-size-adjust:100%}
  main{max-width:640px;margin:0 auto;padding:72px 24px 88px}
  h1{color:var(--ink);font-size:1.7rem;margin:0 0 .3em;letter-spacing:-.02em}
  .lede{color:var(--muted);margin:0 0 44px}
  h2{color:var(--ink);font-size:1rem;margin:0 0 14px;letter-spacing:-.01em}
  .app{display:flex;gap:18px;align-items:center;border:1px solid var(--line);
    border-radius:16px;padding:20px;text-decoration:none;color:inherit;background:var(--soft);
    transition:border-color .15s, transform .15s}
  .app:hover{border-color:#9dc9ae;transform:translateY(-1px)}
  .app img{width:64px;height:64px;border-radius:24%;flex:0 0 auto}
  .app b{display:block;color:var(--ink);font-size:1.1rem}
  .app span{color:var(--muted);font-size:.93rem}
  footer{border-top:1px solid var(--line);margin-top:56px;padding-top:26px;
    color:var(--muted);font-size:.9rem}
  a{color:#2b7a55}
  @media (prefers-color-scheme: dark){
    :root{--ink:#dceae2;--body:#b3c5bb;--muted:#879c91;--card:#111714;--line:#26332c;--soft:#18211c}
    a{color:#7fd4a6}
  }
</style>
</head>
<body>
<main>
  <h1>앱 안내</h1>
  <p class="lede">공개된 앱의 소개와 개인정보처리방침을 모아둔 곳입니다.</p>

  <h2>앱</h2>
  <a class="app" href="./quitsmoking/">
    <img src="./quitsmoking/icon.png" alt="담금 앱 아이콘">
    <div>
      <b>담금</b>
      <span>담배 참는 금연 일기 · Android</span>
    </div>
  </a>
  <a class="app" href="./budgetcalendar/" style="margin-top:12px">
    <img src="./budgetcalendar/icon.png" alt="정돈 앱 아이콘">
    <div>
      <b>정돈</b>
      <span>일정과 가계부를 한 번에 · Android</span>
    </div>
  </a>

  <footer>
    문의 <a href="mailto:xorud01111@gmail.com">xorud01111@gmail.com</a>
  </footer>
</main>
</body>
</html>
